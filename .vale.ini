# Project config. Mirrors the global one and also lints the page's HTML, since
# prose in the interface deserves the same check as prose in the docs.
StylesPath = C:/Users/grupp/.vale/styles

MinAlertLevel = suggestion

Packages = write-good, Microsoft, Google

Vocab = Base

[*.{md,markdown,txt}]
BasedOnStyles = Vale, write-good, Microsoft, Google

# Code spans, fenced blocks and URLs aren't prose.
TokenIgnores = (\x60[^\n\x60]+\x60), (https?://\S+)
BlockIgnores = (?s) *(\x60{3}.*?\x60{3})

# Deduplicate rules all three packages implement. Microsoft keeps passive and
# first person, Google keeps contractions. E-Prime bans every form of "to be",
# which is stricter than this project wants.
write-good.E-Prime = NO
write-good.Passive = NO
write-good.Weasel = NO
Google.Passive = NO
Google.We = NO
Microsoft.Contractions = NO

[*.html]
BasedOnStyles = Vale, write-good, Microsoft, Google

TokenIgnores = (\x60[^\n\x60]+\x60), (https?://\S+)

write-good.E-Prime = NO
write-good.Passive = NO
write-good.Weasel = NO
Google.Passive = NO
Google.We = NO
Microsoft.Contractions = NO
