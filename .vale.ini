# Project config. Mirrors the global one and also lints the page's HTML, since
# prose in the interface deserves the same check as prose in the docs.
StylesPath = C:/Users/grupp/.vale/styles

MinAlertLevel = suggestion

Packages = write-good, Microsoft, Google

Vocab = Base

[*.{md,markdown,txt}]
BasedOnStyles = Vale, write-good, Microsoft, Google

# Fenced blocks in this repository carry no language tag on purpose. Vale 3.17.1
# stops linting a Markdown file at the first fence that has one, silently, so a
# tagged block turns every check below it into a no-op. Losing syntax colour on
# a few shell snippets is cheaper than losing the check on the prose.
#
# Code spans, fenced blocks and URLs aren't prose.
TokenIgnores = (\x60[^\n\x60]+\x60), (https?://\S+), (([a-z0-9-]+\.)+(org|com|gov|net|edu|io)(/\S*)?)
# BlockIgnores does not take effect on this Vale build, so a fenced block's
# contents still get spell checked. Hits on `py`, `src` and shell quoting
# inside the reproduction snippets are code identifiers, not prose.
BlockIgnores = (?s) *(```.*?```)

# Deduplicate rules all three packages implement. Microsoft keeps passive and
# first person, Google keeps contractions. E-Prime bans every form of "to be",
# which is stricter than this project wants.
write-good.E-Prime = NO
write-good.Passive = NO
write-good.Weasel = NO
Google.Passive = NO
Google.We = NO
Microsoft.Contractions = NO

# Vale.Terms capitalises ordinary words this project uses as ordinary words,
# "depletion trend" and "downscaling test" among them.
Vale.Terms = NO

[*.html]
BasedOnStyles = Vale, write-good, Microsoft, Google

TokenIgnores = (\x60[^\n\x60]+\x60), (https?://\S+), (([a-z0-9-]+\.)+(org|com|gov|net|edu|io)(/\S*)?)

write-good.E-Prime = NO
write-good.Passive = NO
write-good.Weasel = NO
Google.Passive = NO
Google.We = NO
Microsoft.Contractions = NO

# Vale.Terms capitalises ordinary words this project uses as ordinary words,
# "depletion trend" and "downscaling test" among them.
Vale.Terms = NO
